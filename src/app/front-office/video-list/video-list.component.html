<div class="container mt-4">
    <div class="section-title">
        <h2>Kids' Learning and Entertainment</h2>
        <p>Welcome to our delightful collection of videos tailored for children! Dive into a world of educational content and entertaining cartoons designed to inspire creativity and foster learning in young minds.</p>
    </div>
    <div class="row">
        <div class="col-md-4" *ngFor="let video of videos">
            <div class="card mb-4 shadow-sm">
                <iframe class="card-img-top"
                        [src]="video.safeUrl"
                        width="100%"
                        height="225"
                        frameborder="0"
                        allowfullscreen>
                </iframe>
                <div class="card-body">
                    <h5 class="card-title">{{ video.title }}</h5>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


  <app-footer></app-footer>

<section id="appointment" class="appointment">
  <div class="container">
    <div class="section-title">
      <h2>Make an Appointment</h2>
      <p>Choose a date for a meeting!</p>
    </div>

    <form (ngSubmit)="createAppointment()" class="php-email-form">
      <div class="row">
        <div class="col-md-4 form-group">
          <input
            type="datetime-local"
            class="form-control"
            [(ngModel)]="appointment.dateTime"
            name="dateTime"
            placeholder="Appointment Date"
            required
          />
          <div class="validate"></div>
        </div>
        <div class="col-md-8 form-group mt-3 mt-md-0">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="appointment.description"
            name="description"
            placeholder="Description"
            required
          />
          <div class="validate"></div>
        </div>
      </div>

      <div class="form-group mt-3">
        <textarea
          class="form-control"
          [(ngModel)]="appointment.message"
          name="message"
          rows="5"
          placeholder="Message (Optional)"
        ></textarea>
        <div class="validate"></div>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary">
          Make an Appointment
        </button>
      </div>
      <div *ngIf="successMessage" class="alert alert-success mt-3">
        {{ successMessage }}
      </div>
    </form>
  </div>
</section>

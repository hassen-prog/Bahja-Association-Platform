<body>
  <div class="signup-container">
    <div class="form-card">
      <div class="logo-container">
        <!-- <img src="../../../assets/img/bahja.png" alt="App Logo" class="logo" /> -->

        <img
          src="../../../assets/back/img/bahjalogo2.png"
          alt="App Logo"
          class="logo"
        />
      </div>

      <form class="user" #loginForm="ngForm" (ngSubmit)="login(loginForm)">
        <div class="form-group">
          <input
            type="text"
            class="form-control form-control-user"
            ngModel
            required
            name="userName"
            id="userName"
            aria-describedby="emailHelp"
            placeholder="Username"
          />
          <div>
            <small
              *ngIf="loginForm.submitted && !loginForm.value.userName"
              class="ng-dirty ng-invalid text-danger font-medium"
            >
              Username is required.</small
            >
          </div>
        </div>
        <div class="form-group">
          <input
            type="password"
            class="form-control form-control-user"
            ngModel
            name="userPassword"
            required
            id="userPassword"
            placeholder="Password"
          />

          <div>
            <small
              *ngIf="loginForm.submitted && !loginForm.value.userPassword"
              class="ng-dirty ng-invalid text-danger font-medium"
            >
              Password is required.</small
            >
          </div>
        </div>
        <div class="form-group">
          <div class="custom-control custom-checkbox large">
            <input
              type="checkbox"
              class="custom-control-input"
              id="customCheck"
            />
            <label class="custom-control-label rememberMe" for="customCheck"
              >Remember Me</label
            >
          </div>
        </div>
        <button type="submit" class="btn btn-user btn-block btn-primary">
          Login
        </button>
        <hr />
        <div class="Login-footer">
          <div class="text-center">
            <a class="small" [routerLink]="['/front/requestPasswordReset']"
              >Forgot Password?</a
            >
          </div>
          <div class="text-center">
            <a class="small" [routerLink]="['/front/signup']"
              >Create an Account!</a
            >
          </div>
        </div>

        <!-- <a href="index.html" class="btn btn-google btn-user btn-block">
          <i class="fab fa-google fa-fw"></i> Login with Google
        </a>
        <a href="index.html" class="btn btn-facebook btn-user btn-block">
          <i class="fab fa-facebook-f fa-fw"></i> Login with Facebook
        </a> -->
      </form>
    </div>
  </div>
</body>

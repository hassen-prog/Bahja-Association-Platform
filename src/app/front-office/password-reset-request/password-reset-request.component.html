    <div class="container">

        <!-- Outer Row -->
        <div class="row justify-content-center">

            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4">Welcome Back!</h1>
                                    </div>
                                    <!-- <form class="user"> -->
                                    <div class="form-group">
                                        <input id="email" [(ngModel)]="email" placeholder="Email" type="email" class="form-control form-control-user"
                                        ngModel required  aria-describedby="emailHelp"
                                            placeholder="Enter email..."></div>
                                        
                                            <button (click)="requestPasswordReset()" class="btn btn-primary btn-user btn-block">
                                                Request Reset Link
                                            </button>
                                            <!-- <div class="font-medium no-underline text-danger mt-4" style="margin-left: 100px;" *ngIf="message">
                                                {{ message }}
                                            </div> -->
                                            <div>
                                                <small  *ngIf="message"
                                              class="ng-dirty ng-invalid text-danger font-medium">
                                              {{ message }}</small>
                                              </div>
                                      

                                    <hr>
                                    <div class="text-center">
                                        <a class="small" [routerLink]="['/front/requestPasswordReset']">Forgot Password?</a>
                                    </div>
                                    <div class="text-center">
                                        <a class="small" href="register.html">Create an Account!</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

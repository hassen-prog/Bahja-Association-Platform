<body>
  <div class="signup-container">
    <div class="form-card">
      <div class="logo-container">
        <!-- <img src="../../../assets/img/bahja.png" alt="App Logo" class="logo" /> -->

        <img
          src="../../../assets/back/img/bahjalogo2.png"
          alt="App Logo"
          class="logo"
        />
        <div class="text-center">
          <a class="large" [routerLink]="['/front/login']"
            >Already have an account Login!</a
          >
        </div>
      </div>

      <h2>Create Your Account</h2>

      <div *ngIf="errorMessage" class="alert alert-danger">
        <i class="fas fa-exclamation-circle"></i>
        {{ errorMessage }}
      </div>

      <div class="role-tabs">
        <button
          type="button"
          (click)="setRole('Parent')"
          [class.active]="signupForm.get('role')?.value === 'Parent'"
        >
          <i class="fas fa-user-friends"></i> Parent
        </button>
        <button
          type="button"
          (click)="setRole('Kid')"
          [class.active]="signupForm.get('role')?.value === 'Kid'"
        >
          <i class="fas fa-child"></i> Kid
        </button>
      </div>

      <form
        [formGroup]="signupForm"
        (ngSubmit)="onSubmit()"
        class="form-content"
      >
        <div class="form-grid">
          <!-- Column 1: Account Information -->
          <div class="form-column">
            <h3 class="section-title">Account Information</h3>

            <div class="input-group">
              <label for="username">Username <span>*</span></label>
              <div class="input-with-icon">
                <i class="fas fa-user"></i>
                <input
                  id="username"
                  type="text"
                  placeholder="Enter username"
                  formControlName="username"
                />
              </div>
              <div
                *ngIf="
                  signupForm.get('username')?.invalid &&
                  signupForm.get('username')?.touched
                "
                class="error-hint"
              >
                Username is required
              </div>
            </div>

            <div class="input-group">
              <label for="email">Email <span>*</span></label>
              <div class="input-with-icon">
                <i class="fas fa-envelope"></i>
                <input
                  id="email"
                  type="email"
                  placeholder="your@email.com"
                  formControlName="email"
                />
              </div>
              <div
                *ngIf="
                  signupForm.get('email')?.invalid &&
                  signupForm.get('email')?.touched
                "
                class="error-hint"
              >
                Valid email is required
              </div>
            </div>

            <div class="input-group">
              <label for="password">Password <span>*</span></label>
              <div class="input-with-icon">
                <i class="fas fa-lock"></i>
                <input
                  id="password"
                  type="password"
                  placeholder="At least 6 characters"
                  formControlName="password"
                />
              </div>
              <div
                *ngIf="
                  signupForm.get('password')?.invalid &&
                  signupForm.get('password')?.touched
                "
                class="error-hint"
              >
                Password must be at least 6 characters
              </div>
            </div>
          </div>

          <!-- Column 2: Personal Information -->
          <div class="form-column">
            <h3 class="section-title">Personal Information</h3>

            <div class="input-group">
              <label for="userFirstName">First Name</label>
              <div class="input-with-icon">
                <i class="fas fa-signature"></i>
                <input
                  id="userFirstName"
                  type="text"
                  placeholder="First name"
                  formControlName="userFirstName"
                />
              </div>
            </div>

            <div class="input-group">
              <label for="userLastName">Last Name</label>
              <div class="input-with-icon">
                <i class="fas fa-signature"></i>
                <input
                  id="userLastName"
                  type="text"
                  placeholder="Last name"
                  formControlName="userLastName"
                />
              </div>
            </div>

            <div class="input-group">
              <label for="birthDate">Birth Date</label>
              <div class="input-with-icon">
                <i class="fas fa-birthday-cake"></i>
                <input id="birthDate" type="date" formControlName="birthDate" />
              </div>
            </div>
          </div>

          <!-- Column 3: Contact Information -->
          <div class="form-column">
            <h3 class="section-title">Contact Information</h3>

            <div class="input-group">
              <label for="phoneNumber">Phone Number</label>
              <div class="input-with-icon">
                <i class="fas fa-phone"></i>
                <input
                  id="phoneNumber"
                  type="text"
                  placeholder="(123) 456-7890"
                  formControlName="phoneNumber"
                />
              </div>
            </div>

            <div class="input-group">
              <label for="location">Location</label>
              <div class="input-with-icon">
                <i class="fas fa-map-marker-alt"></i>
                <input
                  id="location"
                  type="text"
                  placeholder="City, Country"
                  formControlName="location"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            type="submit"
            [disabled]="!signupForm.valid"
            [class.disabled]="!signupForm.valid"
            class="submit-btn"
          >
            Create Account
          </button>

          <div *ngIf="showBackButton" class="back-section">
            <div *ngIf="successMessage" class="alert alert-success">
              <i class="fas fa-check-circle"></i>
              {{ successMessage }}
            </div>
            <!-- <button (click)="goBack()" class="back-btn">
              <i class="fas fa-arrow-left"></i> Back to Login
            </button> -->
          </div>
        </div>
      </form>
    </div>
  </div>
</body>

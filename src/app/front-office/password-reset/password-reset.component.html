<div class="container">
    <!-- Outer Row -->
    <div class="row justify-content-center">

        <div class="col-xl-10 col-lg-12 col-md-9">

            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Reset Your Password</h1>
                                    <span class="text-600 font-medium">Enter a new password.</span>
                                </div>
                             
                                    <div class="form-group">
                                        <label for="newPassword" class="block text-900 text-xl font-medium mb-2">New Password</label>
                                        <input type="password" class="form-control form-control-user" id="newPassword" [(ngModel)]="newPassword" placeholder="New Password"  required>
                                    </div>

                                    <button (click)="resetPassword()" class="btn btn-primary btn-user btn-block">
                                        Reset Password
                                    </button>

                                    <div class="text-danger mt-4" *ngIf="message">
                                        {{ message }}
                                    </div>
                                    <div *ngIf="passwordResetSuccess">
                                        <button (click)="navigateToLogin()" class="btn btn-primary btn-user btn-block">
                                            Go to Login
                                        </button>
                                    </div>
                            
                                <hr>
                                <div class="text-center">
                                    <a class="small" [routerLink]="['/front/login']">Already have an account? Login!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<app-navbar></app-navbar>

<section id="services" class="services">
  <div class="container">
    <div class="section-title">
      <h2>Discover Our Books</h2>
      <p>
        Explore our diverse collection of books. From educational resources to
        thrilling adventures, find books that match your reading preferences.
      </p>
    </div>
    <div class="row">
      <div
        class="col-lg-4 col-md-6 d-flex align-items-stretch mt-4"
        *ngFor="let book of books"
      >
        <a
          [routerLink]="['/front/dashboardF/bookDetail', book.id]"
          style="text-decoration: none; color: inherit"
        >
          <div class="icon-box">
            <img
              [src]="book.coverImageUrl"
              alt="{{ book.title }}"
              style="width: 100%; height: auto; border-radius: 5px"
            />
            <!-- <h4><a (click)="selectBook(book)">{{book.title}}</a></h4> -->
            <h6>{{ book.author }}</h6>
            <p>{{ book.description | slice : 0 : 100 }}...</p>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>

<app-footer> </app-footer>

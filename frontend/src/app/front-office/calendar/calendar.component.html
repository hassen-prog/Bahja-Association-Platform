<div id="calendar" class="pageContent">
  <div class="calendarContainer">
    <full-calendar
      [options]="calendarOptions()"
      style="
        max-width: 990px;
        max-height: 700px;
        margin: auto;
        color: steelblue;
      "
    />
  </div>
  <div class="MembersList">
    <div class="listTitle">
      <h1>Joining Members</h1>
    </div>
    <div *ngFor="let event of calendarEvents; let i = index">
      <div (click)="toggleEventDetails(i)" class="event-header">
        <strong>{{ event.title }}</strong> - {{ event.date | date : "medium" }}
      </div>

      <div
        *ngIf="true"
        [@expandCollapse]="expandedIndex === i ? 'expanded' : 'collapsed'"
        class="event-details"
      >
        <div>
          <strong>Joining Members:</strong>
          <ul>
            <li *ngFor="let member of event.members">
              {{ member.userFirstName }} {{ member.userLastName }}
            </li>
          </ul>
        </div>

        <div>
          <strong>Interested Members:</strong>
          <ul>
            <li *ngFor="let interested of event.interested">
              {{ interested.userFirstName }} {{ interested.userLastName }}
            </li>
          </ul>
        </div>
      </div>

      <!-- <hr /> -->
    </div>
  </div>
</div>
